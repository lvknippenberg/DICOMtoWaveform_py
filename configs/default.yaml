  energy_smooth_s: 0.1
  thresh_fraction: 0.35
  noise_floor_fraction: 0.15
  searchback_gap_ratio: 1.66
  twave_rr_fraction:
  - 0.2
  - 0.55
  twave_relative_height: 0.5
likelihood:
  noise_margin: 32.0
  noise_spread_factor: 4.0
  soft_low_factor: 1.5
